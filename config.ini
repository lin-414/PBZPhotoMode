; ================================================================
; PBZ Photo Mode (C++) 1.0.62-cpp configuration (UTF-8; any value can be left out to use its default)
; After saving, press X to re-enter photo mode for changes to apply (or restart the game).
; ================================================================

[keys]
; Enter / exit photo mode
key_toggle = X
; Freeze / resume time
key_freeze = F
; Reset the camera to the position / orientation / FOV it had when photo mode was entered
key_reset = R
; Roll reset (level the horizon): sets roll back to 0 only; position, pitch, yaw and FOV stay.
; (Roll itself is on Z and C, see [control] below. Z and C cannot be used here.)
key_roll_reset = V
; FOV up / down (numpad + / -; OEM_PLUS / OEM_MINUS also work)
key_fov_up = ADD
key_fov_down = SUBTRACT
; Pitch (hold to keep turning): UP arrow = look up, DOWN arrow = look down
key_pitch_up = UP
key_pitch_down = DOWN
; Turn the view left / right (hold to keep turning, speed = yaw_speed)
key_yaw_left = LEFT
key_yaw_right = RIGHT

[control]
; Normal movement speed (units per second). Hold Shift to go faster, Ctrl to go slower.
move_speed = 400
boost_mult = 4
slow_mult = 0.3
; Multiplier for mouse look speed while Ctrl is held. Smaller = finer control.
slow_look_mult = 0.1
; Degrees turned per unit of mouse movement
look_sensitivity = 0.1
pitch_limit = 89
invert_y = false
; Free look only works while Alt is held
free_look_requires_alt = true
; Block character movement / camera input from the game while in photo mode (restored on exit)
block_game_input = true
; Vertical movement. The mouse buttons are no longer used for this:
; E = move the camera up (ascend), Q = move the camera down (descend). Q and E do nothing else.
; translate = move the camera up and down, look = tilt (pitch) instead.
mouse_vertical_mode = translate
vertical_speed = 200
; Roll (rotate the picture) speed in degrees per second.
; Z = roll counter-clockwise, C = roll clockwise. Shift = faster, Ctrl = slower.
roll_speed = 60
; Pitch speed for the UP / DOWN arrow keys, in degrees per second. Shift = faster, Ctrl = slower.
pitch_speed = 30
; Turn speed for the LEFT / RIGHT arrow keys, in degrees per second. Shift = faster, Ctrl = slower.
yaw_speed = 90

[gamepad]
; Controller support is switched off, so the mod never polls controllers.
; (Removing this section completely would fall back to the default, which has controller support on.)
pad_enabled = false

[camera]
fov_default = 90
fov_min = 15
fov_max = 150
fov_step = 2
; Ultrawide (21:9 / 32:9): remove the game's 16:9 letterbox lock while in photo mode (black side bars go away; restored on exit)
ultrawide_unlock = true

[effects]
hide_player = false
; Hide the game HUD while in photo mode (visibility restored on exit)
hide_game_hud = true
; Hide interaction prompts (the E-key icons next to interactable objects; restored on exit)
hide_interact_prompt = true
; Hide enemy health bars (switches to the game's own "locked target only" mode; the original mode is restored on exit)
hide_enemy_health_bars = true
; Hide the lock-on marker (the white dot shown on a locked enemy; restored on exit)
hide_lockon_marker = true
; Hide dialogue subtitles (turns off the game's subtitle setting and hides the subtitle widget; restored on exit)
hide_subtitles = true
; Pause time automatically when entering photo mode (default on; false = time keeps running, press F to freeze it manually)
auto_pause_time = true
; dilation = time almost stops (the picture can still move); pause = the game is paused
freeze_mode = pause
freeze_dilation = 0.0001
; Also pause cutscenes (Sequencer players) while frozen; resumed on unfreeze / exit.
; Story scenes often ignore the world pause and keep playing (the picture looks frozen while motion and sound carry on), so this is on by default.
freeze_sequences = true
; Set the volume of all Wwise audio components to zero while frozen (dialogue, ambience and music are muted and restored later).
; Sound keeps playing silently during the freeze; when the volume comes back the current line continues from where it was.
stop_wwise_on_freeze = true
; While frozen, disable camera modifiers and end camera shakes immediately. They run on real time, so the world pause cannot stop them;
; they are the main source of edge jitter and crawling face shadows in a frozen picture. Restored to their previous state on unfreeze.
stop_camera_shakes_on_freeze = true
; While frozen, set the strength and speed of wind sources (WindDirectionalSource) to zero. They drive the vertex sway of cloth and foliage,
; which neither the world pause nor time dilation can stop. Original values restored on unfreeze.
freeze_wind = true
; While frozen, pin the current values of material parameter collections (MPC) and write the snapshot back every frame,
; so real-time driven parameters cannot keep pushing cloth / foliage sway. Released on unfreeze.
freeze_mpc = true
; Log one freeze diagnostic line per second while frozen (wind sources / MPC parameter changes / camera modifier state),
; to find which source of change is still moving cloth and shadows.
freeze_diag = true
restore_fov_on_exit = true
restore_view_on_exit = true

[ui]
; ImGui diagnostics panel in the UE4SS console (needs the UE4SS console window); there is no in-game menu, it is all hotkeys
imgui_tab = true
; Language of the PBZFM menu page: auto = follow the PBZFM menu, or a dictionary id (en-US, zh-CN, ja-JP, ko-KR, or a file name from languages/*.json)
menu_language = en-US

[misc]
log_level = info
dry_run = false
